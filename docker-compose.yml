services:
  dynamodb-local:
    image: amazon/dynamodb-local
    ports:
      - "8001:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    # Create table after start:
    # aws dynamodb create-table --endpoint-url http://localhost:8001 \
    #   --table-name byods-app-state \
    #   --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S \
    #   --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE \
    #   --billing-mode PAY_PER_REQUEST --region us-east-1

  byods-webhook-server:
    build: .
    depends_on:
      - dynamodb-local
    ports:
      - "8000:8000"
      - "${WEBEX_MEDIA_PORT:-50051}:${WEBEX_MEDIA_PORT:-50051}"
    env_file:
      - .env
    environment:
      WEBEX_MEDIA_HOST: 0.0.0.0
      WEBEX_MEDIA_PORT: ${WEBEX_MEDIA_PORT:-50051}
      AWS_ENDPOINT_URL: http://dynamodb-local:8000
      DYNAMODB_TABLE_NAME: byods-app-state
      PERSISTENCE_BACKEND: dynamodb

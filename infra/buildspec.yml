version: 0.2

env:
  exported-variables:
    - IMAGE_TAG

phases:
  pre_build:
    commands:
      - |
        set -euo pipefail
        if [ -z "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}" ]; then
          echo "error: CODEBUILD_RESOLVED_SOURCE_VERSION is not set" >&2
          exit 1
        fi
        export IMAGE_TAG="$CODEBUILD_RESOLVED_SOURCE_VERSION"
        echo "Building ${REPOSITORY_URI}:${IMAGE_TAG} and :latest"
        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
          | docker login --username AWS --password-stdin "$REPOSITORY_URI"
  build:
    commands:
      - |
        set -euo pipefail
        echo "Building image..."
        docker build -t "$REPOSITORY_URI:$IMAGE_TAG" .
        docker tag "$REPOSITORY_URI:$IMAGE_TAG" "$REPOSITORY_URI:latest"
  post_build:
    commands:
      - |
        set -euo pipefail
        echo "Pushing image..."
        docker push "$REPOSITORY_URI:$IMAGE_TAG"
        docker push "$REPOSITORY_URI:latest"
        #region agent log
        source infra/scripts/pipeline_common.sh
        pipeline_debug_log "C" "buildspec.yml:post-build" "Image pushed to ECR" \
          "repository=$REPOSITORY_URI" "imageTag=$IMAGE_TAG" "commit=${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}"
        #endregion
